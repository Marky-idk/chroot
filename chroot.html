<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHROOT // STORE</title>
    
    <!-- Tab Icon -->
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;800&family=JetBrains+Mono&display=swap');

        :root {
            --bg: #050505;
            --surface: #0f0f0f;
            --accent: #1793d1; 
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-dim: #666666;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- Navigation --- */
        nav {
            display: flex;
            justify-content: space-between;
            padding: 20px 6%;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .logo-wrap { display: flex; align-items: center; gap: 12px; }

        .system-icon {
            width: 32px;
            height: 32px;
            background-image: url('icon.png');
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
        }

        .logo-text { font-family: 'JetBrains Mono'; font-weight: 800; font-size: 1.1rem; }
        .logo-text span { color: var(--accent); }

        .cart-trigger {
            cursor: pointer;
            background: var(--surface);
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid var(--border);
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px; right: -5px;
            background: var(--accent);
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
        }

        /* --- Sidebar Cart --- */
        #cart-sidebar {
            position: fixed;
            top: 0; right: -400px;
            width: 380px; height: 100%;
            background: #080808;
            border-left: 1px solid var(--border);
            z-index: 2000;
            transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 40px 25px;
            display: flex;
            flex-direction: column;
        }

        #cart-sidebar.open { right: 0; }

        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .close-cart { cursor: pointer; font-size: 1.5rem; color: var(--text-dim); }

        /* --- THE PRODUCT SECTION (SIDE ALIGNED) --- */
        .container { 
            max-width: 1400px; 
            margin: 60px auto; 
            padding: 0 6%; 
        }

        /* This ensures products stay to the left/side and wrap with perfect gaps */
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px; /* This is your perfect gap */
            justify-content: flex-start; /* Keeps items to the side */
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            width: 350px; /* Fixed width for perfect orientation */
            flex-shrink: 0;
        }

        .img-container {
            background: #000;
            border-radius: 12px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .action-btn {
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            font-family: 'JetBrains Mono';
            font-size: 0.85rem;
        }

        .action-btn:hover { background: var(--accent); color: #fff; }

        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            z-index: 1500;
            backdrop-filter: blur(4px);
        }

        footer {
            padding: 60px 6%;
            text-align: center;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono';
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-wrap">
            <div class="system-icon"></div>
            <div class="logo-text">CHROOT<span>//</span>STORE</div>
        </div>
        <div class="cart-trigger" id="open-cart">
            <i class="fa-solid fa-code-merge"></i>
            <span class="cart-count" id="cart-count-nav">0</span>
        </div>
    </nav>

    <div id="overlay"></div>

    <div id="cart-sidebar">
        <div class="cart-header">
            <h2 style="margin:0; font-family: 'JetBrains Mono';">~/cart</h2>
            <i class="fa-solid fa-xmark close-cart" id="close-cart"></i>
        </div>
        <div id="empty-cart-msg" style="color: var(--text-dim); margin-top: 20px;">[ 0 items in buffer ]</div>
        <div id="cart-content" style="display: none; flex-grow: 1;">
            <div id="cart-items-list"></div>
            <div style="margin-top: auto; border-top: 1px solid var(--border); padding-top: 20px;">
                <a href="https://merchize.com/product/arch-linux-shirt" class="action-btn" style="background: var(--accent); color: white;">
                    SUDO_CHECKOUT
                </a>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- The Product Grid keeps everything oriented to the side -->
        <div class="product-grid">
            
            <!-- Arch Core Tee -->
            <div class="product-card">
                <div class="img-container">
                    <i class="fa-brands fa-linux" style="font-size: 6rem; color: var(--accent);"></i>
                </div>
                <h3 style="margin: 0;">Arch Core Tee v1</h3>
                <p style="color: var(--text-dim); font-size: 0.8rem; margin: 15px 0;">Premium cotton. Optimized for long coding sessions.</p>
                <div style="font-size: 1.4rem; font-weight: 800; margin-bottom: 20px;">$23.00</div>
                <button class="action-btn" onclick="addToCart('Arch Core Tee')">ADD_TO_BIN</button>
            </div>

            <!-- You can paste more product-cards here and they will align perfectly to the side -->

        </div>
    </div>

    <footer>
        &copy; 2026 CHROOT_OS // Chișinău Distribution // Node: 7B
    </footer>

    <script>
        const sidebar = document.getElementById('cart-sidebar');
        const overlay = document.getElementById('overlay');
        const cartContent = document.getElementById('cart-content');
        const emptyMsg = document.getElementById('empty-cart-msg');
        const cartCountNav = document.getElementById('cart-count-nav');
        const itemsList = document.getElementById('cart-items-list');

        function toggleCart() {
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function addToCart(name) {
            emptyMsg.style.display = 'none';
            cartContent.style.display = 'flex';
            cartCountNav.innerText = parseInt(cartCountNav.innerText) + 1;
            
            const item = document.createElement('p');
            item.innerText = `> ${name} (staged)`;
            itemsList.appendChild(item);
            
            toggleCart();
        }

        document.getElementById('open-cart').onclick = toggleCart;
        document.getElementById('close-cart').onclick = toggleCart;
        overlay.onclick = toggleCart;
    </script>
</body>
</html>
